  height: 14px;

  pointer-events: none;

.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);

.form-switch .form-check-input {

  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);

  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);

  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {

}

svg {

}

}

}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;ee1021-lecture3-mobile-pilot&quot;&gt;
  &lt;style&gt;

    #ee1021-lecture3-mobile-pilot .pilot-feedback {

    #ee1021-lecture3-mobile-pilot .pilot-topic-list {

  &lt;/style&gt;

  &lt;div class=&quot;viz-row pilot-meta&quot;&gt;
    &lt;span class=&quot;viz-badge&quot; id=&quot;w3pilot-status&quot;&gt;Ready&lt;/span&gt;
    &lt;span class=&quot;text-small text-muted&quot;&gt;No login · answers stay on this device&lt;/span&gt;
  &lt;/div&gt;

  &lt;section class=&quot;card pilot-card&quot; id=&quot;w3pilot-stage&quot; aria-live=&quot;polite&quot;&gt;
    &lt;p&gt;Loading activity choices…&lt;/p&gt;
  &lt;/section&gt;
&lt;/div&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&quot;ee1021-lecture3-mobile-pilot&quot;);
    const stage = root.querySelector(&quot;#w3pilot-stage&quot;);
    const status = root.querySelector(&quot;#w3pilot-status&quot;);
    document.documentElement.dataset.theme = &quot;light&quot;;
    document.documentElement.style.colorScheme = &quot;light&quot;;

    const intervalSets = [
      {
        label: &quot;Checkpoint 1&quot;,
        timing: &quot;around minute 20&quot;,
        topics: &quot;Function definitions and calls&quot;,
        questions: [
          {
            topic: &quot;Function calls&quot;,
            prompt: &quot;Which line calls the function?&quot;,
            code: &quot;def calibrate_voltage(raw):\n    return raw - 0.12\n\nresult = calibrate_voltage(4.92)\nprint(result)&quot;,
            options: [
              &quot;def calibrate_voltage(raw):&quot;,
              &quot;return raw - 0.12&quot;,
              &quot;result = calibrate_voltage(4.92)&quot;,
              &quot;print(result)&quot;
            ],
            answer: 2,
            explanation: &quot;The call is the expression with the function name followed by parentheses: calibrate_voltage(4.92).&quot;
          }
        ]
      },
      {
        label: &quot;Checkpoint 2&quot;,
        timing: &quot;around minute 45&quot;,
        topics: &quot;Return values and local scope&quot;,
        questions: [
          {
            topic: &quot;Print and return&quot;,
            prompt: &quot;What does this program display?&quot;,
            code: &quot;def show_double(value):\n    print(value * 2)\n\nanswer = show_double(5)\nprint(answer)&quot;,
            options: [
              &quot;10 only&quot;,
              &quot;10, then None&quot;,
              &quot;5, then 10&quot;,
              &quot;Nothing&quot;
            ],
            answer: 1,
            explanation: &quot;show_double prints 10 but has no return statement, so Python returns None; the second print displays it.&quot;
          },
          {
            topic: &quot;Local scope&quot;,
            prompt: &quot;What does this program display?&quot;,
            code: &quot;level = 3\n\ndef test_level():\n    level = 4\n    print(\&quot;inside:\&quot;, level)\n\ntest_level()\nprint(\&quot;outside:\&quot;, level)&quot;,
            options: [
              &quot;inside: 4, then outside: 3&quot;,
              &quot;inside: 4, then outside: 4&quot;,
              &quot;inside: 3, then outside: 3&quot;,
              &quot;An error&quot;
            ],
            answer: 0,
            explanation: &quot;The level created inside test_level is local. It does not replace the global level outside the function.&quot;
          }
        ]
      },
      {
        label: &quot;Checkpoint 3&quot;,
        timing: &quot;around minute 70&quot;,
        topics: &quot;Boundary conditions and modules&quot;,
        questions: [
          {
            topic: &quot;Boundary conditions&quot;,
            prompt: &quot;A sensor is Normal from 4.50 V through 5.00 V, including both limits. How should 4.75 V be classified?&quot;,
            code: &quot;def voltage_status(voltage):\n    if 4.50 &lt;= voltage &lt;= 5.00:\n        return \&quot;Normal\&quot;\n    return \&quot;Check\&quot;&quot;,
            options: [
              &quot;Normal&quot;,
              &quot;Check&quot;,
              &quot;No result&quot;,
              &quot;A boundary error&quot;
            ],
            answer: 0,
            explanation: &quot;4.75 lies inside the inclusive interval 4.50 &lt;= voltage &lt;= 5.00, so the function returns Normal.&quot;
          },
          {
            topic: &quot;Module calls&quot;,
            prompt: &quot;After import sensor_tools, which line correctly calls the module function?&quot;,
            code: &quot;import sensor_tools&quot;,
            options: [
              &quot;calibrate_voltage(4.92)&quot;,
              &quot;sensor_tools.calibrate_voltage(4.92)&quot;,
              &quot;import.calibrate_voltage(4.92)&quot;,
              &quot;sensor_tools = calibrate_voltage(4.92)&quot;
            ],
            answer: 1,
            explanation: &quot;With import sensor_tools, use the module name as a prefix: sensor_tools.calibrate_voltage(...).&quot;
          }
        ]
      }
    ];

    const finalQuestions = [
      {
        topic: &quot;Function calls&quot;,
        prompt: &quot;Which line calls celsius_to_kelvin?&quot;,
        code: &quot;def celsius_to_kelvin(celsius):\n    return celsius + 273.15\n\nkelvin = celsius_to_kelvin(25)&quot;,
        options: [
          &quot;def celsius_to_kelvin(celsius):&quot;,
          &quot;return celsius + 273.15&quot;,
          &quot;kelvin = celsius_to_kelvin(25)&quot;,
          &quot;celsius + 273.15&quot;
        ],
        answer: 2
      },
      {
        topic: &quot;Return values&quot;,
        prompt: &quot;What does this program display?&quot;,
        code: &quot;def scale_sample(value):\n    return value * 2\n\nreading = scale_sample(6)\nprint(reading)&quot;,
        options: [
          &quot;12&quot;,
          &quot;6&quot;,
          &quot;None&quot;,
          &quot;An error&quot;
        ],
        answer: 0
      },
      {
        topic: &quot;Local scope&quot;,
        prompt: &quot;What does this program display?&quot;,
        code: &quot;samples = 2\n\ndef count_samples():\n    samples = 7\n    return samples\n\nprint(count_samples())\nprint(samples)&quot;,
        options: [
          &quot;7, then 2&quot;,
          &quot;7, then 7&quot;,
          &quot;2, then 2&quot;,
          &quot;An error&quot;
        ],
        answer: 0
      },
      {
        topic: &quot;Boundary conditions&quot;,
        prompt: &quot;What does this program display for the upper boundary?&quot;,
        code: &quot;def current_status(current):\n    if 0.0 &lt;= current &lt;= 2.0:\n        return \&quot;Safe\&quot;\n    return \&quot;Alert\&quot;\n\nprint(current_status(2.0))&quot;,
        options: [
          &quot;Safe&quot;,
          &quot;Alert&quot;,
          &quot;None&quot;,
          &quot;A boundary error&quot;
        ],
        answer: 0
      },
      {
        topic: &quot;Module calls&quot;,
        prompt: &quot;After import motor_tools, which line correctly calls rpm_to_hz?&quot;,
        code: &quot;import motor_tools&quot;,
        options: [
          &quot;rpm_to_hz(1200)&quot;,
          &quot;motor_tools.rpm_to_hz(1200)&quot;,
          &quot;import.rpm_to_hz(1200)&quot;,
          &quot;motor_tools = rpm_to_hz(1200)&quot;
        ],
        answer: 1
      }
    ];

    const completedIntervals = new Set();
    let mode = &quot;menu&quot;;
    let activeInterval = 0;
    let activeQuestions = [];
    let questionIndex = 0;
    let attempts = 0;
    let intervalFirstTryCorrect = 0;
    let peerRetries = 0;
    let locked = false;
    let finalAnswers = [];

    function escapeHtml(value) {
      return value.replace(/[&amp;&lt;&gt;\&quot;]/g, character =&gt; ({
        &quot;&amp;&quot;: &quot;&amp;amp;&quot;,
        &quot;&lt;&quot;: &quot;&amp;lt;&quot;,
        &quot;&gt;&quot;: &quot;&amp;gt;&quot;,
        &quot;\&quot;&quot;: &quot;&amp;quot;&quot;
      })[character]);
    }

    function highlightPython(code) {
      const keywords = new Set([
        &quot;and&quot;, &quot;as&quot;, &quot;def&quot;, &quot;elif&quot;, &quot;else&quot;, &quot;False&quot;, &quot;for&quot;, &quot;from&quot;,
        &quot;if&quot;, &quot;import&quot;, &quot;in&quot;, &quot;None&quot;, &quot;not&quot;, &quot;or&quot;, &quot;return&quot;, &quot;True&quot;, &quot;while&quot;
      ]);
      const tokenPattern = /(#[^\n]*|&quot;(?:\\.|[^&quot;\\])*&quot;|&#x27;(?:\\.|[^&#x27;\\])*&#x27;|\b\d+(?:\.\d+)?\b|\b[A-Za-z_]\w*\b|==|!=|&lt;=|&gt;=|-&gt;|[+\-*/%=&lt;&gt;])/g;
      let highlighted = &quot;&quot;;
      let cursor = 0;
      let match;

      while ((match = tokenPattern.exec(code)) !== null) {
        const token = match[0];
        highlighted += escapeHtml(code.slice(cursor, match.index));

        let tokenClass = &quot;&quot;;
        if (token.startsWith(&quot;#&quot;)) {
          tokenClass = &quot;pilot-token-comment&quot;;
        } else if (token.startsWith(&quot;\&quot;&quot;) || token.startsWith(&quot;&#x27;&quot;)) {
          tokenClass = &quot;pilot-token-string&quot;;
        } else if (keywords.has(token)) {
          tokenClass = &quot;pilot-token-keyword&quot;;
        } else if (/^\d/.test(token)) {
          tokenClass = &quot;pilot-token-number&quot;;
        } else if (/^[A-Za-z_]/.test(token) &amp;&amp; /^\s*\(/.test(code.slice(tokenPattern.lastIndex))) {
          tokenClass = &quot;pilot-token-function&quot;;
        } else if (/^(?:==|!=|&lt;=|&gt;=|-&gt;|[+\-*/%=&lt;&gt;])$/.test(token)) {
          tokenClass = &quot;pilot-token-operator&quot;;
        }

        highlighted += tokenClass
          ? `&lt;span class=&quot;${tokenClass}&quot;&gt;${escapeHtml(token)}&lt;/span&gt;`
          : escapeHtml(token);
        cursor = tokenPattern.lastIndex;
      }

      return highlighted + escapeHtml(code.slice(cursor));
    }

    function renderMenu() {
      mode = &quot;menu&quot;;
      status.textContent = &quot;Choose activity&quot;;
      const intervalButtons = intervalSets.map((set, setIndex) =&gt; {
        const completed = completedIntervals.has(setIndex) ? &quot; · Completed&quot; : &quot;&quot;;
        return `
          &lt;div class=&quot;pilot-menu-item&quot;&gt;
            &lt;p class=&quot;pilot-menu-heading&quot; data-interval-status=&quot;${setIndex}&quot;&gt;${escapeHtml(set.label)} · ${escapeHtml(set.timing)}${completed}&lt;/p&gt;
            &lt;p&gt;${escapeHtml(set.topics)}&lt;/p&gt;
            &lt;button class=&quot;btn btn-block&quot; type=&quot;button&quot; data-interval=&quot;${setIndex}&quot;&gt;Open ${escapeHtml(set.label)}&lt;/button&gt;
          &lt;/div&gt;
        `;
      }).join(&quot;&quot;);

      stage.innerHTML = `
        &lt;div class=&quot;pilot-menu-group&quot;&gt;
          &lt;p class=&quot;pilot-menu-heading&quot;&gt;During the lesson&lt;/p&gt;
          &lt;p&gt;Open only the checkpoint your instructor announces. Peer discussion and one retry are included.&lt;/p&gt;
          ${intervalButtons}
        &lt;/div&gt;
        &lt;div class=&quot;pilot-menu-group pilot-menu-final&quot;&gt;
          &lt;p class=&quot;pilot-menu-heading&quot;&gt;End of lesson&lt;/p&gt;
          &lt;p&gt;Five new questions, answered individually. Results appear after the last question.&lt;/p&gt;
          &lt;button class=&quot;btn btn-primary btn-block&quot; id=&quot;w3pilot-final-start&quot; type=&quot;button&quot;&gt;Start final 5-question checkout&lt;/button&gt;
        &lt;/div&gt;
      `;

      stage.querySelectorAll(&quot;[data-interval]&quot;).forEach(button =&gt; {
        button.addEventListener(&quot;click&quot;, () =&gt; startInterval(Number(button.dataset.interval)));
      });
      stage.querySelector(&quot;#w3pilot-final-start&quot;).addEventListener(&quot;click&quot;, startFinalCheckout);
    }

    function startInterval(setIndex) {
      mode = &quot;interval&quot;;
      activeInterval = setIndex;
      activeQuestions = intervalSets[setIndex].questions;
      questionIndex = 0;
      intervalFirstTryCorrect = 0;
      peerRetries = 0;
      renderQuestion();
    }

    function startFinalCheckout() {
      mode = &quot;final&quot;;
      activeQuestions = finalQuestions;
      questionIndex = 0;
      finalAnswers = [];
      renderQuestion();
    }

    function renderQuestion() {
      const question = activeQuestions[questionIndex];
      attempts = 0;
      locked = false;
      status.textContent = mode === &quot;final&quot;
        ? `Final checkout · ${questionIndex + 1} of ${activeQuestions.length}`
        : `${intervalSets[activeInterval].label} · ${questionIndex + 1} of ${activeQuestions.length}`;

      const options = question.options.map((option, optionIndex) =&gt; `
        &lt;div class=&quot;form-check&quot;&gt;
          &lt;input class=&quot;form-check-input&quot; type=&quot;radio&quot; name=&quot;w3pilot-answer&quot; id=&quot;w3pilot-option-${optionIndex}&quot; value=&quot;${optionIndex}&quot;&gt;
          &lt;label class=&quot;form-check-label&quot; for=&quot;w3pilot-option-${optionIndex}&quot;&gt;${escapeHtml(option)}&lt;/label&gt;
        &lt;/div&gt;
      `).join(&quot;&quot;);

      stage.innerHTML = `
        &lt;fieldset&gt;
          &lt;legend&gt;${escapeHtml(question.prompt)}&lt;/legend&gt;
          &lt;div class=&quot;pilot-code&quot; aria-label=&quot;Python code example&quot;&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;Python code&lt;/span&gt;
            &lt;pre&gt;&lt;code&gt;${highlightPython(question.code)}&lt;/code&gt;&lt;/pre&gt;
          &lt;/div&gt;
          &lt;div class=&quot;pilot-options&quot;&gt;
            &lt;p class=&quot;pilot-options-title&quot;&gt;Choose one answer&lt;/p&gt;
            ${options}
          &lt;/div&gt;
        &lt;/fieldset&gt;
        &lt;div class=&quot;pilot-feedback&quot; id=&quot;w3pilot-feedback&quot; aria-live=&quot;assertive&quot;&gt;&lt;/div&gt;
        &lt;div class=&quot;pilot-actions&quot;&gt;
          &lt;button class=&quot;btn btn-primary btn-block&quot; id=&quot;w3pilot-submit&quot; type=&quot;button&quot;&gt;${mode === &quot;final&quot; ? (questionIndex === activeQuestions.length - 1 ? &quot;Finish checkout&quot; : &quot;Save answer and continue&quot;) : &quot;Check answer&quot;}&lt;/button&gt;
        &lt;/div&gt;
      `;

      stage.querySelector(&quot;#w3pilot-submit&quot;).addEventListener(&quot;click&quot;, submitAnswer);
    }

    function submitAnswer() {
      if (locked) return;
      const selected = stage.querySelector(&#x27;input[name=&quot;w3pilot-answer&quot;]:checked&#x27;);
      const feedback = stage.querySelector(&quot;#w3pilot-feedback&quot;);
      const submit = stage.querySelector(&quot;#w3pilot-submit&quot;);

      if (!selected) {
        feedback.innerHTML = &#x27;&lt;p class=&quot;text-destructive&quot;&gt;Choose one answer first.&lt;/p&gt;&#x27;;
        return;
      }

      if (mode === &quot;final&quot;) {
        finalAnswers[questionIndex] = Number(selected.value);
        questionIndex += 1;
        if (questionIndex &lt; activeQuestions.length) {
          renderQuestion();
        } else {
          renderFinalResult();
        }
        return;
      }

      attempts += 1;
      const question = activeQuestions[questionIndex];
      const isCorrect = Number(selected.value) === question.answer;

      if (isCorrect) {
        if (attempts === 1) intervalFirstTryCorrect += 1;
        locked = true;
        feedback.innerHTML = `&lt;p&gt;&lt;strong&gt;Correct.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;${escapeHtml(question.explanation)}&lt;/p&gt;`;
        submit.textContent = questionIndex === activeQuestions.length - 1 ? &quot;Complete checkpoint&quot; : &quot;Next question&quot;;
        submit.removeEventListener(&quot;click&quot;, submitAnswer);
        submit.addEventListener(&quot;click&quot;, advanceInterval);
        return;
      }

      if (attempts === 1) {
        peerRetries += 1;
        feedback.innerHTML = &#x27;&lt;p class=&quot;text-destructive&quot;&gt;&lt;strong&gt;Not yet.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;Discuss your reasoning with a neighbor for 45 seconds, then try again.&lt;/p&gt;&#x27;;
        selected.checked = false;
        submit.textContent = &quot;Check retry&quot;;
        return;
      }

      locked = true;
      feedback.innerHTML = `&lt;p class=&quot;text-destructive&quot;&gt;&lt;strong&gt;Let’s resolve it.&lt;/strong&gt;&lt;/p&gt;&lt;p&gt;The correct answer is &lt;strong&gt;${escapeHtml(question.options[question.answer])}&lt;/strong&gt;.&lt;/p&gt;&lt;p&gt;${escapeHtml(question.explanation)}&lt;/p&gt;`;
      submit.textContent = questionIndex === activeQuestions.length - 1 ? &quot;Complete checkpoint&quot; : &quot;Next question&quot;;
      submit.removeEventListener(&quot;click&quot;, submitAnswer);
      submit.addEventListener(&quot;click&quot;, advanceInterval);
    }

    function advanceInterval() {
      questionIndex += 1;
      if (questionIndex &lt; activeQuestions.length) {
        renderQuestion();
      } else {
        renderIntervalResult();
      }
    }

    function renderIntervalResult() {
      completedIntervals.add(activeInterval);
      status.textContent = `${intervalSets[activeInterval].label} complete`;
      stage.innerHTML = `
        &lt;p class=&quot;pilot-result-heading&quot;&gt;Checkpoint complete&lt;/p&gt;
        &lt;p&gt;&lt;strong&gt;${intervalFirstTryCorrect} of ${activeQuestions.length}&lt;/strong&gt; correct before peer retry.&lt;/p&gt;
        &lt;p&gt;${peerRetries === 0 ? &quot;No peer retry was needed.&quot; : `${peerRetries} question${peerRetries === 1 ? &quot;&quot; : &quot;s&quot;} triggered discussion and retry.`}&lt;/p&gt;
        &lt;button class=&quot;btn btn-primary btn-block&quot; id=&quot;w3pilot-menu&quot; type=&quot;button&quot;&gt;Return to activity menu&lt;/button&gt;
      `;
      stage.querySelector(&quot;#w3pilot-menu&quot;).addEventListener(&quot;click&quot;, renderMenu);
    }

    function renderFinalResult() {
      const score = finalQuestions.reduce((total, question, resultIndex) =&gt; {
        return total + (finalAnswers[resultIndex] === question.answer ? 1 : 0);
      }, 0);
      const missedTopics = [...new Set(finalQuestions
        .filter((question, resultIndex) =&gt; finalAnswers[resultIndex] !== question.answer)
        .map(question =&gt; question.topic))];
      const review = missedTopics.length === 0
        ? &quot;&lt;p&gt;All five concepts were retrieved successfully.&lt;/p&gt;&quot;
        : `&lt;p class=&quot;pilot-result-heading&quot;&gt;Review next&lt;/p&gt;&lt;ul class=&quot;pilot-topic-list&quot;&gt;${missedTopics.map(topic =&gt; `&lt;li&gt;${escapeHtml(topic)}&lt;/li&gt;`).join(&quot;&quot;)}&lt;/ul&gt;`;

      status.textContent = &quot;Final checkout complete&quot;;
      stage.innerHTML = `
        &lt;p&gt;&lt;strong&gt;${score} of ${finalQuestions.length}&lt;/strong&gt; correct.&lt;/p&gt;
        ${review}
        &lt;p class=&quot;text-small&quot;&gt;Show this screen to your instructor when asked.&lt;/p&gt;
        &lt;div class=&quot;pilot-actions&quot;&gt;
          &lt;button class=&quot;btn btn-primary btn-block&quot; id=&quot;w3pilot-final-retry&quot; type=&quot;button&quot;&gt;Try the final checkout again&lt;/button&gt;
          &lt;button class=&quot;btn btn-block&quot; id=&quot;w3pilot-menu&quot; type=&quot;button&quot;&gt;Return to activity menu&lt;/button&gt;
        &lt;/div&gt;
      `;
      stage.querySelector(&quot;#w3pilot-final-retry&quot;).addEventListener(&quot;click&quot;, startFinalCheckout);
      stage.querySelector(&quot;#w3pilot-menu&quot;).addEventListener(&quot;click&quot;, renderMenu);
    }

    function startRequestedMode(requestedMode) {
      if (requestedMode === &quot;final&quot;) {
        startFinalCheckout();
        return true;
      }

      const intervalMatch = /^interval-([0-2])$/.exec(requestedMode || &quot;&quot;);
      if (intervalMatch) {
        startInterval(Number(intervalMatch[1]));
        return true;
      }

      return false;
    }

    window.addEventListener(&quot;message&quot;, event =&gt; {
      if (event.data &amp;&amp; event.data.type === &quot;ee1021-lecture3-start&quot;) {
        if (event.data.presentation) {
          document.documentElement.style.setProperty(&quot;--font-size-base&quot;, &quot;18px&quot;);
        }
        startRequestedMode(event.data.mode);
      }
    });

    const directMode = new URLSearchParams(window.location.search).get(&quot;mode&quot;);
    if (directMode) document.documentElement.style.setProperty(&quot;--font-size-base&quot;, &quot;18px&quot;);
    if (!startRequestedMode(directMode)) renderMenu();
    if (window.parent !== window) {
      window.parent.postMessage({ type: &quot;ee1021-lecture3-ready&quot; }, &quot;*&quot;);
    }
  })();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;

    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });

<script>
  (() => {
    document.documentElement.style.colorScheme = "light";
    const activityFrame = document.querySelector("iframe");
    const mode = new URLSearchParams(window.location.search).get("mode");
    const sendMode = () => activityFrame.contentWindow.postMessage({
